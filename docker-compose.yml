services:
  db:
    # The tests start their own containers from this image, so they run on the
    # same major version. See src/test/prepare-test-database.ts.
    image: postgres:17
    restart: unless-stopped
    ports:
      # Loopback only: the credentials are fixed and the app is single-user.
      - '127.0.0.1:5434:5432'
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo_over_kill
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP. The socket is up while the entrypoint still initialises.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U todo -d todo_over_kill']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
