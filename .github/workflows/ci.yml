name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, unit, and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_over_kill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_over_kill_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      # Both point at the test database: CI has no app data, and the unit tests
      # check that they run against todo_over_kill_test.
      DATABASE_URL: postgresql://todo:todo@localhost:5432/todo_over_kill_test
      DATABASE_URL_TEST: postgresql://todo:todo@localhost:5432/todo_over_kill_test

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
